<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HONEY - Digital Archive</title>

    <!-- 密码拦截 -->
    <script>
        if(localStorage.getItem('honey_unlocked') !== 'true') {
            window.location.href = "login.html";
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0c0c0c; --text-main: #f4f4f4; --text-muted: #7a7a7a;
            --border-color: #2a2a2a; --pill-bg: #121212; --white: #ffffff;
            --dot-active: #ffffff; --dot-inactive: #333333; --green-dot: #00ffcc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Montserrat', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; position: relative; }

        /* 顶部导航 */
        header { display: flex; justify-content: space-between; align-items: center; padding: 24px 40px; width: 100%; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-circle { width: 32px; height: 32px; border: 1px solid var(--border-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 10px; font-family: 'Cormorant Garamond', serif; color: var(--text-muted); }
        .logo-text { font-size: 11px; letter-spacing: 0.2em; color: var(--text-muted); }
        .center-nav { display: flex; align-items: center; background-color: var(--pill-bg); border: 1px solid var(--border-color); border-radius: 30px; padding: 10px 30px; gap: 24px; }
        .center-nav a { color: var(--text-muted); text-decoration: none; font-size: 10px; letter-spacing: 0.15em; transition: color 0.3s ease; }
        .center-nav a:hover { color: var(--text-main); }
        .nav-dot { width: 3px; height: 3px; background-color: var(--border-color); border-radius: 50%; }
        .right-actions { display: flex; align-items: center; gap: 12px; }
        .btn-blog { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-muted); text-decoration: none; font-size: 10px; letter-spacing: 0.15em; }
        .status-dot { width: 5px; height: 5px; background-color: var(--green-dot); border-radius: 50%; box-shadow: 0 0 8px var(--green-dot); }
        .btn-home { background-color: var(--white); color: #000; padding: 8px 20px; border-radius: 20px; font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-decoration: none; }
        
        /* 手机端汉堡按钮 */
        .mobile-menu-btn { display: none; cursor: pointer; color: var(--text-main); font-size: 24px; }

        /* 主体 */
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; margin-top: -5vh; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 110px; font-weight: 400; letter-spacing: 0.02em; margin-bottom: 8px; background: linear-gradient(180deg, #ffffff 0%, #b3b3b3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: #d0d0d0; letter-spacing: 0.03em; margin-bottom: 45px; }
        .social-icons { display: flex; gap: 16px; }
        .icon-circle { width: 42px; height: 42px; border: 1px solid var(--border-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--text-muted); text-decoration: none; transition: all 0.3s ease; }
        .icon-circle:hover { border-color: var(--text-main); color: var(--text-main); transform: translateY(-2px); }
        .icon-circle svg { width: 16px; height: 16px; fill: currentColor; }
        .page-indicators { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; align-items: center; }
        .indicator-dot { width: 4px; height: 4px; border-radius: 50%; background-color: var(--dot-inactive); }
        .indicator-dot.active { width: 7px; height: 7px; background-color: var(--dot-active); box-shadow: 0 0 6px rgba(255,255,255,0.4); }
        .scroll-down { position: absolute; bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .scroll-down span { font-size: 8px; letter-spacing: 0.3em; color: var(--text-muted); }
        .mouse-icon { width: 12px; height: 24px; border: 1px solid var(--border-color); border-radius: 10px; position: relative; }
        .mouse-wheel { width: 2px; height: 4px; background-color: var(--text-muted); border-radius: 2px; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); animation: scroll 2s infinite ease-in-out; }
        @keyframes scroll { 0% { opacity: 0; transform: translate(-50%, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 8px); } }

        /* 响应式 */
        @media (max-width: 1024px) {
            h1 { font-size: 80px; }
            .subtitle { font-size: 18px; }
            .center-nav { display: none; }
            .mobile-menu-btn { display: block; } /* 显示汉堡按钮 */
            .btn-blog { display: none; } /* 手机端隐藏多余的BLOG */
        }
        @media (max-width: 768px) {
            header { padding: 20px; }
            h1 { font-size: 56px; }
            .subtitle { font-size: 14px; text-align: center; padding: 0 20px; }
            .page-indicators { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-circle">CY</div>
            <div class="logo-text">HONEY-LEYU</div>
        </div>
        
        <nav class="center-nav">
            <a href="project.html">PROJECT EXPERIENCE</a>
            <div class="nav-dot"></div>
            <a href="cheerleading.html">STUNT CHEERLEADING</a>
            <div class="nav-dot"></div>
            <a href="honor.html">CERTIFICATE OF HONOR</a>
        </nav>
        
        <div class="right-actions">
            <a href="#" class="btn-blog"><div class="status-dot"></div>BLOG</a>
            <a href="#" class="btn-home">HOME</a>
            <!-- 手机端点击这个展开菜单（简单的下拉跳转） -->
            <div class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</div>
        </div>
    </header>

    <!-- 手机端隐藏菜单 -->
    <div id="mobileNav" style="display:none; position:absolute; top:80px; left:0; width:100%; background:#121212; border-bottom:1px solid #2a2a2a; z-index:100; flex-direction:column; padding:20px; gap:20px;">
        <a href="project.html" style="color:#f4f4f4; text-decoration:none; font-size:12px; letter-spacing:0.1em;">PROJECT EXPERIENCE</a>
        <a href="cheerleading.html" style="color:#f4f4f4; text-decoration:none; font-size:12px; letter-spacing:0.1em;">STUNT CHEERLEADING</a>
        <a href="honor.html" style="color:#f4f4f4; text-decoration:none; font-size:12px; letter-spacing:0.1em;">CERTIFICATE OF HONOR</a>
    </div>

    <main>
        <h1>HONEY</h1>
        <p class="subtitle">Digital Archive of Personal Honors and Certificates</p>
        <div class="social-icons">
            <a href="#" class="icon-circle"><svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg></a>
            <a href="#" class="icon-circle"><svg viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg></a>
            <a href="#" class="icon-circle"><svg viewBox="0 0 24 24"><text x="12" y="16" font-size="10" text-anchor="middle" font-family="sans-serif" fill="currentColor">微博</text></svg></a>
        </div>
        <div class="page-indicators">
            <div class="indicator-dot active"></div><div class="indicator-dot"></div><div class="indicator-dot"></div><div class="indicator-dot"></div><div class="indicator-dot"></div><div class="indicator-dot"></div>
        </div>
        <div class="scroll-down"><span>LOOK UP</span><div class="mouse-icon"><div class="mouse-wheel"></div></div></div>
    </main>
    
    <script>
        // 手机端菜单折叠逻辑
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileNav');
            menu.style.display = menu.style.display === 'none' || menu.style.display === '' ? 'flex' : 'none';
        }
    </script>
</body>
</html>
