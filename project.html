<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HONEY - Project Experience</title>

    <!-- 密码拦截（记住状态） -->
    <script>
        if(localStorage.getItem('honey_unlocked') !== 'true') {
            window.location.replace("login.html");
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-color: #0c0c0c; --text-main: #f4f4f4; --text-muted: #7a7a7a; --border-color: #2a2a2a; --pill-bg: #121212; --white: #ffffff; --green-dot: #00ffcc; --gold: #dcb27e; --gold-bg: rgba(220, 178, 126, 0.1); --card-bg: #131313; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 24px 40px; width: 100%; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-circle { width: 32px; height: 32px; border: 1px solid var(--border-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 10px; font-family: 'Cormorant Garamond', serif; color: var(--text-muted); }
        .logo-text { font-size: 11px; letter-spacing: 0.2em; color: var(--text-muted); }
        
        .center-nav { display: flex; align-items: center; background-color: var(--pill-bg); border: 1px solid var(--border-color); border-radius: 30px; padding: 10px 30px; gap: 24px; }
        .center-nav a { color: var(--text-muted); text-decoration: none; font-size: 10px; letter-spacing: 0.15em; transition: color 0.3s; }
        .center-nav a:hover, .center-nav a.active { color: var(--text-main); }
        .nav-dot { width: 3px; height: 3px; background-color: var(--border-color); border-radius: 50%; }
        
        .right-actions { display: flex; align-items: center; gap: 12px; }
        .btn-blog { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-muted); text-decoration: none; font-size: 10px; letter-spacing: 0.15em; }
        .status-dot { width: 5px; height: 5px; background-color: var(--green-dot); border-radius: 50%; box-shadow: 0 0 8px var(--green-dot); }
        .btn-home { background-color: var(--white); color: #000; padding: 8px 20px; border-radius: 20px; font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-decoration: none; }
        .mobile-menu-btn { display: none; cursor: pointer; color: var(--text-main); font-size: 24px; }

        main { padding: 20px 40px 60px; flex: 1; max-width: 1440px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        
        .tabs { 
            display: flex; gap: 16px; margin-bottom: 32px; 
            overflow-x: auto; white-space: nowrap; 
            -webkit-overflow-scrolling: touch;
            padding-bottom: 5px;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { flex-shrink: 0;
            display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 20px; border-radius: 20px; font-size: 10px; letter-spacing: 0.15em; cursor: pointer; transition: all 0.3s ease; 
        }
        .tab-btn:hover { border-color: var(--text-muted); color: var(--text-main); }
        .tab-btn.active { border-color: var(--text-main); color: var(--text-main); background-color: rgba(255,255,255,0.03); }
        .tab-dot { width: 5px; height: 5px; border-radius: 50%; background-color: transparent; }
        .tab-btn.active .tab-dot { background-color: var(--green-dot); box-shadow: 0 0 6px var(--green-dot); }
        
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; min-height: 400px;}
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: transform 0.3s ease, border-color 0.3s ease; display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-4px); border-color: #444; }
        .card-top { height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; border-bottom: 1px solid rgba(255,255,255,0.03); position: relative; }
        .tob-badge { position: absolute; top: 16px; right: 16px; background-color: #1a1a1a; color: var(--gold); font-size: 9px; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.1em; border: 1px solid rgba(220, 178, 126, 0.2); }
        .badge-icon { width: 44px; height: 44px; border: 1px dashed var(--gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--gold); background-color: var(--gold-bg); }
        .badge-icon svg { width: 20px; height: 20px; fill: currentColor; }
        .card-top span { font-size: 10px; letter-spacing: 0.2em; color: var(--text-muted); }
        
        .card-bottom { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .card-title { font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 22px; font-weight: 500; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info-row { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .info-row:last-child { border-bottom: none; padding-bottom: 0; }
        .info-label { color: var(--text-muted); letter-spacing: 0.1em; flex-shrink: 0; margin-right: 10px; }
        .info-value { color: #ccc; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info-value.gold { color: var(--gold); }
        
        .link-url { color: var(--text-muted); text-decoration: underline; text-underline-offset: 3px; transition: color 0.2s; }
        .link-url:hover { color: var(--white); }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: auto; padding-top: 20px; }
        .page-item { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 12px; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        .page-item:hover { color: var(--text-main); background-color: rgba(255,255,255,0.05); }
        .page-item.active { background-color: var(--gold); color: #000; font-weight: 500; }
        .page-arrow { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; transition: all 0.2s;}
        .page-arrow:hover { border-color: var(--text-main); color: var(--text-main); }
        .page-arrow.disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--border-color); color: var(--text-muted); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .close-btn { position: absolute; top: 30px; right: 40px; background: none; border: none; color: var(--text-muted); font-size: 40px; cursor: pointer; transition: color 0.2s; line-height: 1; z-index: 1001; }
        .close-btn:hover { color: var(--white); }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 90%; max-width: 700px; display: flex; flex-direction: column; overflow: hidden; transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 20px 60px rgba(0,0,0,0.8); max-height: 90vh; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-img-area { width: 100%; height: 350px; background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--border-color); overflow: hidden; }
        .modal-img-area img { width: 100%; height: 100%; object-fit: contain; }
        .modal-info-area { padding: 30px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        .modal-info-area .card-title { font-size: 24px; margin-bottom: 8px; white-space: normal; }
        .modal-info-area .info-row { font-size: 13px; padding-bottom: 16px; }
        .modal-info-area .info-value { white-space: normal; text-align: right; word-break: break-all;}
        .img-placeholder { color: var(--gold); font-size: 14px; letter-spacing: 0.1em; text-align: center; padding: 20px; }

        @media (max-width: 1024px) { 
            .cards-grid { grid-template-columns: repeat(2, 1fr); } 
            .center-nav { display: none; } 
            .mobile-menu-btn { display: block; }
            .btn-blog { display: none; }
        }
        @media (max-width: 768px) { 
            header { padding: 16px 20px; } 
            main { padding: 20px; } 
            .cards-grid { grid-template-columns: 1fr; min-height: auto;} 
            .close-btn { top: 15px; right: 20px; font-size: 30px; } 
            .modal-img-area { height: 250px; } 
        }
    </style>
</head>
<body>

    <main>
        <div class="tabs">

        <button class="close-btn" id="close-modal">&times;</button>
        <div class="modal-content">
            <div class="modal-img-area" id="modal-img-area"></div>
            <div class="modal-info-area" id="modal-info-area"></div>
        </div>
    </div>

    <script>
        function toggleMobileMenu() { const menu = document.getElementById('mobileNav'); menu.style.display = menu.style.display === 'none' || menu.style.display === '' ? 'flex' : 'none'; }

        const uiuxData = [
            { type: "TO C", title: "飞洋杯业", time: "2026.08", url: "www.fly-cup.com", industry: "杯子 WORDPRESS" },
            { type: "TO C", title: "ziraspark", time: "2026.07", url: "https://www.ziraspark.com/", industry: "醋酸发夹 SHOPIFY" },

            { type: "TO C", title: "Altis Powersports", time: "2026.03", url: "https://www.altispowersports.eu/", industry: "摩托车 SHOPIFY" },

        ];

        const shopifyData = [
            { type: "TO C", title: "Joymesigns", time: "2026.08", url: "joymesigns.myshopify.com", industry: "装饰品" },
            { type: "TO C", title: "FlexSolar", time: "2026.07", url: "https://flexsolarenergy.com/", industry: "光伏板" },
            { type: "TO C", title: "Kefine", time: "2026.07", url: "https://8amdvu-rf.myshopify.com/", industry: "耳机" },
            { type: "TO C", title: "MAD SHARK", time: "2026.07", url: "https://madshark.co/", industry: "厨房用品" },
            { type: "TO C", title: "SynaDental", time: "2026.07", url: "https://synadental.myshopify.com/", industry: "义齿" },
            { type: "TO C", title: "onwavelondon", time: "2026.06", url: "https://www.onwavelondon.com/", industry: "服装⭐" },
            { type: "TO C", title: "XCH-AU", time: "2026.06", url: "https://gjn7kq-iz.myshopify.com/", industry: "猫砂" },
            { type: "TO C", title: "Yumecosplay", time: "2026.05", url: "https://yumecos.myshopify.com/", industry: "cosplay" },
            { type: "TO C", title: "HUIDA MOWER", time: "2026.05", url: "https://ayef69-29.myshopify.com/", industry: "遥控割草机" },
            { type: "TO C", title: "TUOC", time: "2026.03", url: "https://tuoc.design/", industry: "IF宠物碗" },
            { type: "TO C", title: "Feel Good Wavaes", time: "2026.02", url: "https://feelgood-waves.com/", industry: "玩具、儿童教育" },
            { type: "TO C", title: "Sichuan Mighty Machinery", time: "2026.02", url: "https://mti8ex-kx.myshopify.com/", industry: "机械传送带" },
            { type: "TO C", title: "Minipangmall", time: "2026.01", url: "https://minipangmall.com/", industry: "家电" },
            { type: "TO C", title: "EFFINOVO", time: "2025.12", url: "https://www.effinovo.com/", industry: "清洁用品" },
            { type: "TO C", title: "EcoPawPaw", time: "2025.11", url: "https://ecopawpaw.com/", industry: "宠物" },
            { type: "TO C", title: "YOUNGYAN CAPSULE SKINCARE", time: "2025.11", url: "https://youngyanskincare.com/", industry: "护肤品" },
            { type: "TO C", title: "Chemme", time: "2025.11", url: "https://mychemme.com/", industry: "爱心碗" },
            { type: "TO C", title: "Axamate lighting", time: "2025.11", url: "https://0nqbzr-8m.myshopify.com/", industry: "灯具" },
            { type: "TO C", title: "Torva", time: "2025.11", url: "https://www.torva.com/", industry: "水槽" }
        ];

        // 最新录入的 12 个 Wordpress 项目
        const wordpressData = [
            { type: "TO C", title: "ALLGOLFGOODS", time: "2026.04", url: "https://allgolfgoods.com/", industry: "高尔夫" },
            { type: "TO C", title: "bijiang", time: "2026.05", url: "https://bijiang666.com/home/", industry: "化妆品（仿站）" },
            { type: "TO C", title: "maya", time: "2026.06", url: "hangzhoumaya.com", industry: "包装" },
            { type: "TO C", title: "Elisyia", time: "2026.08", url: "https://elisyia.com/", industry: "玩具" },
            { type: "TO B", title: "泉州凯鑫食品", time: "2026.08", url: "https://kaixingummy.com/", industry: "糖果" },
            { type: "TO C", title: "Elvagem", time: "2026.08", url: "https://elvagems.com/", industry: "珠宝（仿牌）" },
            { type: "TO C", title: "JIN QI Jewelry", time: "2026.08", url: "https://jinqijewelry.com/", industry: "珠宝" },
            { type: "TO C", title: "makeup", time: "2026.06", url: "http://47.88.77.85:8000/", industry: "化妆品（老巫婆）" },
            { type: "TO C", title: "創木工房", time: "2026.05", url: "https://woodkobo.com/", industry: "木质玩具" },
            { type: "TO B", title: "Globx", time: "2026.09", url: "https://globx-international.com/", industry: "供应商" },
            { type: "TO B", title: "鑫宝达", time: "2026.09", url: "https://khaki-mallard-182697.hostingersite.com/", industry: "安全防撞" },
            { type: "TO C", title: "yulanflower", time: "2026.09", url: "https://yulanflower.com/", industry: "珠宝（仿牌）" }
        ];

        // 合并所有数据作为 ALL PROJECTS 展示
        const allData = [...uiuxData, ...shopifyData, ...wordpressData];
        
        // 按照时间戳从大到小（时间倒序）重新排列
        allData.sort((a, b) => {
            const timeA = a.time.replace(/\./g, ''); // 去掉点号
            const timeB = b.time.replace(/\./g, '');
            return timeB.localeCompare(timeA);
        });

        const projectData = {
            all: allData,
            uiux: uiuxData,
            shopify: shopifyData,
            wordpress: wordpressData
        };

        const container = document.getElementById('project-grid');
        const tabs = document.querySelectorAll('.tab-btn');
        const paginationContainer = document.getElementById('pagination');
        const modal = document.getElementById('modal');
        const closeModalBtn = document.getElementById('close-modal');

        let currentPage = 1;
        const itemsPerPage = 6; 
        let currentData = [];

        function formatUrl(url) {
            if (!url) return "#";
            if (url.startsWith("http://") || url.startsWith("https://")) return url;
            return "https://" + url;
        }

        function renderPage(page) {
            container.style.opacity = '0';
            currentPage = page;
            
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = currentData.slice(startIndex, endIndex);

            setTimeout(() => {
                container.innerHTML = '';
                pageData.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-top">
                            <div class="tob-badge">${item.type}</div>
                            <div class="badge-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
                            <span>MY DESIGN</span>
                        </div>
                        <div class="card-bottom">
                            <div class="card-title" title="${item.title}">${item.title}</div>
                            <div class="info-row"><span class="info-label">TIME</span><span class="info-value">${item.time}</span></div>
                            <div class="info-row">
                                <span class="info-label">URL</span>
                                <a href="${formatUrl(item.url)}" target="_blank" class="info-value link-url" onclick="event.stopPropagation();" title="${item.url}">${item.url}</a>
                            </div>
                            <div class="info-row"><span class="info-label">INDUSTRY</span><span class="info-value gold">${item.industry}</span></div>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal(item));
                    container.appendChild(card);
                });
                container.style.opacity = '1';
                renderPagination();
            }, 200);
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(currentData.length / itemsPerPage);

            if (totalPages <= 1) {
                if (totalPages === 1) {
                     paginationContainer.innerHTML = `<div class="page-item active">1</div>`;
                }
                return;
            }

            const prevBtn = document.createElement('div');
            prevBtn.className = `page-arrow ${currentPage === 1 ? 'disabled' : ''}`;
            prevBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>`;
            if (currentPage > 1) {
                prevBtn.addEventListener('click', () => renderPage(currentPage - 1));
            }
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageItem = document.createElement('div');
                pageItem.className = `page-item ${i === currentPage ? 'active' : ''}`;
                pageItem.textContent = i;
                pageItem.addEventListener('click', () => renderPage(i));
                paginationContainer.appendChild(pageItem);
            }

            const nextBtn = document.createElement('div');
            nextBtn.className = `page-arrow ${currentPage === totalPages ? 'disabled' : ''}`;
            nextBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>`;
            if (currentPage < totalPages) {
                nextBtn.addEventListener('click', () => renderPage(currentPage + 1));
            }
            paginationContainer.appendChild(nextBtn);
        }

        function initTab(type) {
            currentData = projectData[type] || [];
            currentPage = 1; 
            renderPage(1);
        }

        function openModal(item) {
            const imgArea = document.getElementById('modal-img-area');
            const infoArea = document.getElementById('modal-info-area');
            
            imgArea.innerHTML = `<div class="img-placeholder">My Design<br><br><span style="font-size:10px; color:#666;">(图片暂未上传)</span></div>`;
            
            infoArea.innerHTML = `
                <div class="card-title">${item.title}</div>
                <div class="info-row"><span class="info-label">TYPE</span><span class="info-value">${item.type}</span></div>
                <div class="info-row"><span class="info-label">TIME</span><span class="info-value">${item.time}</span></div>
                <div class="info-row">
                    <span class="info-label">URL</span>
                    <a href="${formatUrl(item.url)}" target="_blank" class="info-value link-url" onclick="event.stopPropagation();">${item.url}</a>
                </div>
                <div class="info-row"><span class="info-label">INDUSTRY</span><span class="info-value gold">${item.industry}</span></div>
            `;
            modal.classList.add('active');
        }

        closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.remove('active'); });

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                initTab(tab.getAttribute('data-target'));
            });
        });

        initTab('all');
    </script>
</body>
</html>
